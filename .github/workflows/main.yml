name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install dependencies
        run: npm install
      - name: Create www folder and copy files
        run: |
          mkdir -p www
          cp index.html style.css main.js game_core.js www/
          cp -r games www/
          cp -r assets www/ 2>/dev/null || echo "No assets folder found"
          cp manifest.json service-worker.js www/ 2>/dev/null || echo "No PWA files found"
      - name: Build Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Game Hub" "com.a480.gamehub" --web-dir www
          npx cap add android
          npx cap copy
      - name: Build APK
        run: |
          cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
