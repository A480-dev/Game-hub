name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create www folder and copy files
        run: |
          mkdir -p www
          cp index.html style.css main.js game_core.js www/ || true
          cp -r games www/ || true
          cp -r assets www/ 2>/dev/null || echo "No assets"
          cp manifest.json service-worker.js www/ 2>/dev/null || echo "No PWA files"

      - name: Build Project
        run: |
          npx cap init "Game Hub" "com.a480.gamehub" --web-dir www
          npx cap add android
          
      - name: Fix Kotlin conflicts
        run: |
          cat <<EOF >> android/build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  }
              }
          }
          EOF

      - name: Copy files to Android
        run: npx cap copy android

      - name: Build APK
        run: |
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
